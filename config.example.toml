[app]
# false is the safe default. Set true only after reviewing dry-run proposals.
apply_labels = false
# By default, configuration, credentials.json, and SQLite state use this
# operating system's per-user application data directory. Optional absolute
# path overrides can be set here.

[polling]
interval_seconds = 60

[classification]
# Laya confidence is a review signal, not a guarantee of correctness.
confidence_threshold = 0.90
max_excerpt_chars = 3000

[labels]
action = "IA/Acción"
receipts = "IA/Recibos"
newsletters = "IA/Boletines"
work = "IA/Trabajo"
personal = "IA/Personal"
spam = "IA/Spam"
