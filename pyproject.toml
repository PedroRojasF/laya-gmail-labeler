[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-gmail-labeler"
version = "0.1.0"
description = "Local-first Gmail labels using Laya on desktop systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "laya>=0.3.23,<0.4",
  "google-api-python-client>=2,<3",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<27",
  "platformdirs>=4,<5",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
laya-gmail-labeler = "laya_gmail_labeler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
